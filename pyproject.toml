[project]
name = "chemclaw2-gui"
version = "0.1.0"
description = "Streamlit GUI for chemclaw2."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Upper bounds prevent surprise breakage when uv.lock is regenerated
    # against fresh PyPI metadata. Bump bands deliberately with a manual
    # smoke test rather than catching breakage in CI.
    "streamlit>=1.40,<2",
    "streamlit-ketcher>=0.0.1,<1",
    "streamlit-markdown>=1.0,<2",
    "sseclient-py>=1.8,<2",
    "httpx>=0.27,<1",
    "rdkit>=2024.9.1,<2027",
    "drfp>=0.3.7,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
# Force resolution to consider all production deploy targets even when run on
# a host whose platform-specific wheels are different. rdkit dropped Intel Mac
# wheels after 2024.3.5; we deploy on Linux x86_64 so the lockfile must
# include those wheels.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() and fastapi.Query() are designed to be used as default args.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
# Per-module overrides below: keep the global flag off so a typo in our own
# imports surfaces as a mypy error rather than being silently ignored.

[[tool.mypy.overrides]]
module = [
    "rdkit",
    "rdkit.*",
    "drfp",
    "drfp.*",
    "streamlit",
    "streamlit.*",
    "streamlit_ketcher",
    "streamlit_ketcher.*",
    "streamlit_markdown",
    "streamlit_markdown.*",
    "sseclient",
    "sseclient.*",
]
ignore_missing_imports = true

# Tests intentionally pass weakly-typed event lists, monkeypatch private
# module attributes, etc. — strict mode there fights the point of unit tests.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined"]
