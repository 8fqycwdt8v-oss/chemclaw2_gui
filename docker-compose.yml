services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file: .env
    environment:
      # Override for compose: Streamlit reaches chemclaw2 on the host network
      CHEMCLAW2_API_URL: ${CHEMCLAW2_API_URL:-http://host.docker.internal:8080}
      STREAMLIT_LOGIN_PROVIDER: ${STREAMLIT_LOGIN_PROVIDER:-microsoft}
    ports:
      - "8501:8501"
    volumes:
      # Mount real secrets locally without baking into the image
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
