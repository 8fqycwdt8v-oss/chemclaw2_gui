[project]
name = "chemclaw2-gui"
version = "0.1.0"
description = "Streamlit GUI + FastAPI BFF for chemclaw2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "streamlit-ketcher>=0.0.1",
    "streamlit-markdown>=1.0",
    "sseclient-py>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "pydantic>=2.9",
    "rdkit>=2024.9.1",
    "drfp>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
# Force resolution to consider all production deploy targets even when run on
# a host whose platform-specific wheels are different. rdkit dropped Intel Mac
# wheels after 2024.3.5; we deploy on Linux x86_64 so the lockfile must
# include those wheels.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() and fastapi.Query() are designed to be used as default args.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
